[project]
name = "lullsense"
version = "0.1.0"
description = "LullSense (知眠) — open-source, evidence-informed baby/toddler sleep Agent Skill and analysis engine"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
lullsense-analyze = "scripts.analyze_sleep:main"
lullsense-experiment = "scripts.experiment:main"

[tool.setuptools]
packages = [
    "baby_sleep",
    "baby_sleep.contract",
    "baby_sleep.ingest",
    "baby_sleep.store",
    "baby_sleep.analyze",
    "baby_sleep.detect",
    "baby_sleep.review",
    "scripts",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["DTZ001", "DTZ005", "DTZ006", "DTZ007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
