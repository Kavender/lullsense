[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lullsense"
version = "0.1.0"
description = "LullSense (知眠) — open-source, evidence-informed baby & toddler sleep consultant (Agent Skill + optional analysis engine); works from conversation alone, sharper with recent sleep history"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pyyaml>=6.0", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
lullsense-analyze = "scripts.analyze_sleep:main"
lullsense-experiment = "scripts.experiment:main"

# Automatic discovery so a new subpackage (e.g. baby_sleep.predict) can never
# again be silently omitted from the wheel. Scoped to our namespaces so tests/
# and evals/ stay out of the distribution.
[tool.setuptools.packages.find]
include = ["baby_sleep*", "scripts*"]

# Runtime data shipped inside the wheel (loaded via importlib.resources).
[tool.setuptools.package-data]
"baby_sleep.predict" = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["DTZ001", "DTZ005", "DTZ006", "DTZ007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
