- id: aap_febrile_infant_cpg_2021
  organization: American Academy of Pediatrics
  title: "Clinical Practice Guideline: Evaluation and Management of Well-Appearing Febrile Infants 8 to 60 Days Old"
  url: https://doi.org/10.1542/peds.2021-052228
  source_type: guideline
  verified: true
  last_accessed: 2026-08-24
  note: "Human-verified against the primary PDF (Pantell et al., Pediatrics 2021;148(2):e2021052228). Confirmed: fever = rectal >=38.0C/100.4F (p.9); scope is well-appearing infants 8-60 days (ill-appearing and <8 days excluded as higher-risk, p.6,9). Backs young-infant-fever urgency; the parent-facing '<3mo (12 weeks)' framing comes from aap_when_to_call_pediatrician_fever. Clinician-level management (LP, antibiotics, admission) intentionally NOT surfaced to parents (passive-net posture)."

