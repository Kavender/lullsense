- id: aap_brue_cpg_2016
  organization: American Academy of Pediatrics
  title: "Brief Resolved Unexplained Events (Formerly Apparent Life-Threatening Events) and Evaluation of Lower-Risk Infants"
  url: https://doi.org/10.1542/peds.2016-0590
  source_type: guideline
  verified: true
  last_accessed: 2026-08-24
  note: "Human-verified against the primary PDF (Tieder et al., Pediatrics 2016;137(5):e20160590). BRUE definition confirmed verbatim (p.1,3): infant <1yr, sudden/brief/now-resolved episode of >=1 of cyanosis/pallor, absent-decreased-irregular breathing, marked tone change, altered responsiveness. Lower-risk criteria confirmed (p.5) but intentionally NOT used for parent self-triage — any such episode routes to prompt evaluation (passive-net posture)."

