name: Release

# Cut a versioned release without PyPI: build the wheel + sdist, smoke-test the
# wheel, and attach both to a GitHub Release. Users can then install a pinned
# artifact from the Releases page (or `pip install <wheel-url>`) — no build
# toolchain, no PyPI publish. Tag a GREEN commit on main, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

# Needed to create the release and upload assets with the default GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + attach wheel/sdist to a GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -l dist

      - name: Tag must match the package version
        # Guard against tagging v0.2.0 while pyproject still says 0.1.0.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "FAIL: tag v$tag does not match pyproject version $pkg"; exit 1; }

      - name: Smoke-test the built wheel from a clean venv (outside the source tree)
        run: |
          python -m venv /tmp/relsmoke
          /tmp/relsmoke/bin/pip install dist/*.whl
          cp tests/fixtures/huckleberry_sample.csv /tmp/rel_fix.csv
          cd /tmp
          /tmp/relsmoke/bin/lullsense-analyze --help > /dev/null
          /tmp/relsmoke/bin/lullsense-experiment --help > /dev/null
          /tmp/relsmoke/bin/lullsense-analyze --format huckleberry --input /tmp/rel_fix.csv --age-months 9 > /dev/null
          echo "wheel smoke OK"

      - name: Create the GitHub Release and upload artifacts (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists — updating assets."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
