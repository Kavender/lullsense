name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · tests · knowledge · evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Validate knowledge base
        run: python scripts/validate_knowledge.py
      - name: Proactive detector eval
        run: python evals/proactive/run_proactive_eval.py
      - name: Longitudinal review eval
        run: python evals/proactive/run_review_eval.py

  wheel-smoke:
    name: Clean-wheel install + prediction smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
      - name: Smoke-test from outside the source tree
        # Run from a temp dir so any accidental source-repo-layout dependency
        # (the P0.1 failure mode) surfaces instead of being masked by the checkout.
        run: |
          cp tests/fixtures/huckleberry_sample.csv /tmp/smoke_fix.csv
          cd /tmp
          /tmp/smoke/bin/lullsense-analyze --help > /dev/null
          /tmp/smoke/bin/lullsense-experiment --help > /dev/null
          echo "== standard analysis =="
          /tmp/smoke/bin/lullsense-analyze --format huckleberry --input /tmp/smoke_fix.csv --age-months 9 > /dev/null
          echo "== review =="
          /tmp/smoke/bin/lullsense-analyze --format huckleberry --input /tmp/smoke_fix.csv --age-months 9 --review > /dev/null
          echo "== prediction (packaged heuristic table) =="
          /tmp/smoke/bin/lullsense-analyze --format huckleberry --input /tmp/smoke_fix.csv --age-months 9 \
            --predict --last-wake 14:30 --target nap \
            | python -c "import sys, json; d = json.load(sys.stdin); assert d['prediction']['status'] == 'computed', d['prediction']; print('prediction OK:', d['prediction']['next_event']['window_low'], '-', d['prediction']['next_event']['window_high'])"

  skill-resolve-smoke:
    name: Skills-CLI resolves the skill (npx skills add)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve the skill from the local checkout (no circular GitHub fetch)
        # Tests THIS commit's skill folder, not the pushed state: the skills CLI
        # validates the SKILL.md frontmatter + structure and must find exactly
        # one skill named "lullsense". Guards the install path that PR #8 only
        # verified by hand once. Timeout so a stray prompt fails loud, not hangs.
        run: |
          set -o pipefail
          raw=$(NO_COLOR=1 FORCE_COLOR=0 timeout 180 npx --yes skills add ./skills/lullsense --list -y 2>&1 || true)
          # The CLI colour-wraps its output (incl. the skill count) even when
          # non-interactive, so strip ANSI escapes before matching.
          out=$(printf '%s' "$raw" | perl -pe 's/\e\[[0-9;?]*[a-zA-Z]//g')
          echo "$out"
          echo "$out" | grep -q "Found 1 skill" || { echo "FAIL: skills CLI did not resolve exactly 1 skill from ./skills/lullsense"; exit 1; }
          echo "$out" | grep -qi "lullsense"      || { echo "FAIL: resolved skill is not named 'lullsense'"; exit 1; }
          echo "OK: npx skills add resolves the lullsense skill"
      - name: References and knowledge resolve inside the skill folder
        run: |
          test -f skills/lullsense/SKILL.md                                    || { echo "FAIL: missing SKILL.md"; exit 1; }
          test "$(find skills/lullsense/references -name '*.md' | wc -l)" -gt 0 || { echo "FAIL: no reference files"; exit 1; }
          test -d skills/lullsense/knowledge                                   || { echo "FAIL: no knowledge dir"; exit 1; }
          if grep -q "\.\./" skills/lullsense/SKILL.md; then echo "FAIL: SKILL.md references a path outside the skill folder"; exit 1; fi
          echo "OK: skill structure intact"
      - name: SKILL.md description within the publish cap (≤900, hard cap 1024)
        # The skills standard hard-caps the frontmatter description at 1024 chars;
        # keep 900 as a soft ceiling so routine edits never bump the real limit.
        run: |
          python - <<'PY'
          import re, sys
          t = open("skills/lullsense/SKILL.md", encoding="utf-8").read()
          m = re.search(r"description: >-\n(.*?)\n---", t, re.S)
          assert m, "FAIL: could not find a folded `description: >-` block in SKILL.md frontmatter"
          n = len(" ".join(m.group(1).split()))
          print(f"description length: {n} chars (soft cap 900, hard cap 1024)")
          if n > 900:
              sys.exit(f"FAIL: description is {n} chars — trim to <=900 (hard publish cap is 1024)")
          print("OK: description within cap")
          PY
