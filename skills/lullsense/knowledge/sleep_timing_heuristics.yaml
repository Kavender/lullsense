# PROVISIONAL — wake-window & nap-length numbers are practitioner heuristics
# (evidence_level low), NOT a clinical standard. No peer-reviewed source publishes
# wake-window tables (Galland 2012 confirms). Bands are deliberately WIDE where
# consumer tables (Huckleberry / Taking Cara Babies / Napper) disagree.
# Maintainer must review/replace these values before public release.
# total_sleep_budget_hours + expected_nap_count carry clinical anchors.
- age_band_months: [4, 6]
  wake_window_minutes: {min: 90, max: 150}
  typical_nap_minutes: {min: 30, max: 120}
  expected_nap_count: {min: 3, max: 4}
  total_sleep_budget_hours: {min: 12, max: 16}
  source_type: heuristic
  clinical_anchors: [total_sleep_4_12_months, nap_phase_progression]
  notes: "Wake-window/nap-length are practitioner heuristics; no clinical table exists."
- age_band_months: [6, 9]
  wake_window_minutes: {min: 120, max: 180}
  typical_nap_minutes: {min: 45, max: 120}
  expected_nap_count: {min: 2, max: 3}
  total_sleep_budget_hours: {min: 12, max: 16}
  source_type: heuristic
  clinical_anchors: [total_sleep_4_12_months, nap_phase_progression]
  notes: "Practitioner heuristic; wide band."
- age_band_months: [9, 12]
  wake_window_minutes: {min: 150, max: 210}
  typical_nap_minutes: {min: 45, max: 120}
  expected_nap_count: {min: 2, max: 2}
  total_sleep_budget_hours: {min: 12, max: 16}
  source_type: heuristic
  clinical_anchors: [total_sleep_4_12_months, nap_phase_progression]
  notes: "Practitioner heuristic; wide band."
- age_band_months: [12, 18]
  wake_window_minutes: {min: 180, max: 270}
  typical_nap_minutes: {min: 60, max: 150}
  expected_nap_count: {min: 1, max: 2}
  total_sleep_budget_hours: {min: 11, max: 14}
  source_type: heuristic
  clinical_anchors: [total_sleep_1_2_years, nap_transition_2to1_timing]
  notes: "2->1 nap transition spans this band; wide."
- age_band_months: [18, 36]
  wake_window_minutes: {min: 240, max: 360}
  typical_nap_minutes: {min: 60, max: 150}
  expected_nap_count: {min: 1, max: 1}
  total_sleep_budget_hours: {min: 11, max: 14}
  source_type: heuristic
  clinical_anchors: [total_sleep_1_2_years]
  notes: "Single afternoon nap; wide practitioner heuristic."
