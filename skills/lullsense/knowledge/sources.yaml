    pages reviewed 2026-11-04 for the sleep-relevant items quoted in developmental-sleep.md §6.

- id: who_mgrs_2006_motor_windows
  organization: World Health Organization — Multicentre Growth Reference Study Group
  title: "WHO Motor Development Study: windows of achievement for six gross motor development milestones"
  url: https://doi.org/10.1111/j.1651-2227.2006.tb02379.x
  source_type: primary_research
  verified: true
  last_accessed: 2026-11-04
  note: >-
    Acta Paediatr Suppl 2006;450:86-95. Verified 2026-11-04 against the WHO-hosted
    supplement PDF (abstract p.86): 816 healthy children, 5 countries, monthly visits;
    1st-99th percentile windows in months — sitting without support 3.8-9.2; standing with
    assistance 4.8-11.4; hands-and-knees crawling 5.2-13.5 (4.3% never crawled);
    walking with assistance 5.9-13.7; standing alone 6.9-16.9; walking alone 8.2-17.6.
    No sex differences. Windows describe normal variation, not targets.

# CAM-160 (2026-11-07) additions: nap/night distribution, nap counts and transitions.
# Agent-checked only (abstract or publisher page via web fetch/search), NOT human full-text
# verification, so all stay verified: false. No DOI below was invented: each one appears on
# the publisher/indexer page named in note:.

- id: nakagawa_2016_nap_night
  organization: Nature Portfolio / Scientific Reports
  title: "Daytime nap controls toddlers' nighttime sleep"
  url: https://www.nature.com/articles/srep27246
  source_type: primary_research
  verified: false
  last_accessed: 2026-11-07
  note: >-
    Nakagawa M et al. Sci Rep 2016;6:27246 (PMID 27277329, PMC4899693). Actigraphy, n=50
    toddlers ~1.5 years. Abstract (via PubMed/search summary 2026-11-07; nature.com
    redirected to login): longer naps correlate with shorter night sleep and later sleep
    onset; neither nap duration nor nap-ending time correlated with 24-h total sleep — naps
    shift the day/night distribution, not the amount. Correlational, single age point. A
    2021 follow-up by the same group (PMC7862350) did not replicate the nap-END-time link.

- id: thorpe_2015_naps_sr
  organization: BMJ / Archives of Disease in Childhood
  title: "Napping, development and health from 0 to 5 years: a systematic review"
  url: https://eprints.qut.edu.au/82020/
  source_type: systematic_review
  verified: false
  last_accessed: 2026-11-07
  note: >-
    Thorpe K, Staton S, Sawyer E, Pattinson C, Haden C, Smith S. Arch Dis Child
    2015;100(7):615-622, doi:10.1136/archdischild-2014-307241 (DOI as listed on the QUT
    eprints record). Abstract checked 2026-11-07: "The most consistent finding was an
    association between napping and later onset, shorter duration and poorer quality of
    night sleep, with evidence strongest beyond the age of 2 years." All 26 studies
    observational (GRADE-low). Full text not read.

- id: staton_2020_naps_sr
  organization: Elsevier / Sleep Medicine Reviews
  title: "Many naps, one nap, none: A systematic review and meta-analysis of napping patterns in children 0-12 years"
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9704850/
  source_type: systematic_review
  verified: false
  last_accessed: 2026-11-07
  note: >-
    Staton S, Rankin PS, Harding M, Smith SS, Westwood E, LeBourgeois MK, Thorpe KJ. Sleep
    Med Rev 2020;50:101247 (online 2019), doi:10.1016/j.smrv.2019.101247 (as listed on PMC).
    Abstract checked 2026-11-07: dramatic reduction in >=2 naps/day around 12-18 months;
    <2.5% stop napping before age 2, 94% by age 5; beyond age 2 napping is associated with
    reduced night sleep ("a redistribution in 24-h sleep timing"). Full text not read.

