# knowledge/sources.yaml
# Authoritative source inventory for the LullSense project.
# Verification state: all A_safety sources are human-verified (verified: true) — accessible
# HealthyChildren/AAP pages by review, and the four AAP journal PDFs against their primary full text.
# Non-safety B/C/D journal sources remain verified: false pending later review. See note: fields.
# last_accessed reflects the date the URL was last confirmed to resolve.
# See references/evidence-methodology.md §7 for full schema documentation.

