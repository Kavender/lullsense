- id: meltzer_mindell_2014_meta_analysis
  organization: Oxford University Press / Journal of Pediatric Psychology
  title: "Systematic Review and Meta-Analysis of Behavioral Interventions for Pediatric Insomnia"
  url: https://academic.oup.com/jpepsy/article-abstract/39/8/932/2951972
  source_type: systematic_review
  verified: false
  last_accessed: 2026-08-23

- id: reuter_2020_infant_sleep_systematic_review
  organization: Wiley / Acta Paediatrica
  title: "A Systematic Review of Prevention and Treatment of Infant Behavioural Sleep Problems"
  url: https://doi.org/10.1111/apa.15182
  source_type: systematic_review
  verified: true
  last_accessed: 2026-08-25
  note: >-
    Verified 2026-08-25 against the open-access full text (Acta Paediatr 2020;109(9):
    1717-1732; CC-BY-NC). Access: Wiley/PubMed pages were 403-blocked to automated fetch;
    abstract quoted verbatim from the Europe PMC REST API (high confidence), Discussion/
    GRADE passages via a reader-proxy render of the OA HTML (consistent with the abstract).
    12 included studies, population "infants 0-24 months". Findings are CAUTIOUS: "Five
    interventions with behavioural methods ... showed modest short-term effects"; "Some
    support for short-term effects of behavioural treatment strategies was found, but more
    studies are needed." Crucially, "No overall evaluation of effects according to GRADE was
    made" (no intervention studied in >1 trial) - so this source does NOT establish high-
    grade evidence. It flags under-6-months as a KNOWLEDGE GAP, so it does not affirmatively
    support a "5-6 months onward" claim. Supports the harms claim: at Price et al 5-year
    follow-up "neither long-term harm nor benefit ... on ... stress regulation, child-parent
    relationship" - but this rests on a single follow-up study (evidence_level 'moderate' is
    generous; low-moderate safer if Reuter is the sole citation).

- id: mindell_williamson_2018_bedtime_routine
  organization: Elsevier / Sleep Medicine Reviews
  title: "Benefits of a Bedtime Routine in Young Children: Sleep, Development, and Beyond"
  url: https://doi.org/10.1016/j.smrv.2017.10.007
  source_type: review
  verified: false
  last_accessed: 2026-08-23

- id: gradisar_2016_infant_sleep_rct
  organization: American Academy of Pediatrics / Pediatrics
  title: "Behavioral Interventions for Infant Sleep Problems: A Randomized Controlled Trial"
  url: https://doi.org/10.1542/peds.2015-1486
  source_type: primary_research
  verified: true
  last_accessed: 2026-08-26
  note: >-
    Verified against PDF (human-obtained full text, read 2026-08-26). Gradisar M,
    Jackson K, Spurrier NJ, Gibson J, Whitham J, Sved Williams A, Dolby R, Kennaway DJ.
    Pediatrics 2016;137(6):e20151486 (DOI 10.1542/peds.2015-1486; ANZCTR
    ACTRN12612000813886). RCT of n=43 infants aged 6-16 mo (mean 10.8) randomized to
    graduated extinction (n=14), bedtime fading (n=15), or sleep-education control (n=14)
    (p.1-2). Both interventions improved sleep with large effects (sleep latency d=0.87
    GE / 1.04 BF, p.4); diurnal infant salivary cortisol showed small-to-moderate PM
    declines and no chronic elevation, and at 12-mo follow-up there were no significant
    between-group differences in Strange-Situation attachment (secure 54/60/62%) or CBCL
    emotional/behavioral problems (all P>.05) (p.1, p.5-7, Table 3). Conclusion (p.1):
    both methods "convey no adverse stress responses or long-term effects on parent-child
    attachment or child emotions and behavior." Authors' own caveats: real-time nocturnal
    cortisol not measured ("We cannot conclude no cortisol response occurred," p.6), small
    single-site sample, allocation not concealed from the coordinator, and independent
    replication is needed (p.7-8). Supports the "in studied populations" no-lasting-harm
    framing of behavioral_interventions_safety, NOT a blanket safety guarantee.

