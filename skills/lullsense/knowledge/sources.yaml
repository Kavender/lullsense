- id: van_de_rijt_plooij_1992_infantile_regressions
  organization: Journal of Reproductive and Infant Psychology (Taylor & Francis)
  title: "Infantile regressions: disorganization and the onset of transition periods"
  url: https://doi.org/10.1080/02646839208403946
  source_type: primary_research
  verified: true
  last_accessed: 2026-11-04
  note: >-
    van de Rijt-Plooij & Plooij 1992;10(3):129-149. Human-verified 2026-11-04 against the
    publisher's full text (PDF archived internally). The research basis of the popular
    "Wonder Weeks" / "Oei, ik groei!" leap calendar. Multiple case-study design: 15 Dutch
    mother-infant pairs (14 full-term + 1 born 4 weeks early, age-corrected) followed 0-20
    months with weekly maternal questionnaires/checksheets plus home observation. Mothers'
    "difficult" weeks clustered around 5, 8, 12, 17, 26, 36, 44, 52, 61-62 and 72-73 weeks
    (median difficult period 3 weeks, range 1-6). Only increased crying and increased body
    contact were reported by all mothers in all periods; "decrease in amount of sleep" was
    reported by a majority for all periods except ~12 weeks — infants "slept less ... slept
    in shorter bouts: they woke up more often" (Results). Small sample, maternal report,
    authors are the calendar's commercial authors; strict timing was not supported by the
    independent replication (de_weerth_van_geert_1998_regression_replication). Cite only
    as the origin of the leap vocabulary — never as a timetable.

- id: de_weerth_van_geert_1998_regression_replication
  organization: British Journal of Developmental Psychology
  title: "Emotional instability as an indicator of strictly timed infantile developmental transitions"
  url: https://doi.org/10.1111/j.2044-835X.1998.tb00748.x
  source_type: primary_research
  verified: true
  last_accessed: 2026-11-04
  note: >-
    de Weerth & van Geert 1998;16:15-44 (University of Groningen). Human-verified
    2026-11-04 against the publisher's version self-archived as thesis chapter 2
    (https://pure.rug.nl/ws/portalfiles/portal/10645647/c2.pdf). Four mother-infant pairs
    observed weekly at home from birth to 15 months (crying, fretting/fussing, smiling, body
    contact). Conclusion, verbatim: "No support has been found for the model of ten regression
    periods described by Van de Rijt-Plooij & Plooij (1992a), notwithstanding the fact that the
    original criteria were at points significantly weakened ... This finding does not imply
    that regressions and transitions do not occur during infancy. It does suggest ... that such
    regressions and transitions are subject to much more individual variation than the Plooij
    data indicate, and ... that the number of universally occurring regression periods, if any
    such exist, is considerably smaller than ten." Plooij disputed the analysis (1998
    exchange); partial replications (Sadurní & Rostan, Catalonia; Lindahl et al., Sweden) are
    collected in Heimann (ed.) 2003, Regression Periods in Human Infancy.

- id: cdc_milestones_2022_zubler
  organization: Centers for Disease Control and Prevention / American Academy of Pediatrics
  title: "Evidence-Informed Milestones for Developmental Surveillance Tools (CDC 'Learn the Signs. Act Early.' checklists, 2022 revision)"
  url: https://www.cdc.gov/act-early/milestones/index.html
  source_type: guideline
  verified: true
  last_accessed: 2026-11-04
  note: >-
    Zubler et al., Pediatrics 2022;149(3):e2021052138 (doi:10.1542/peds.2021-052138; free
