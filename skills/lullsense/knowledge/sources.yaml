# ── C_behavioral layer sources ────────────────────────────────────────────────

- id: mindell_2006_behavioral_treatment_review
  organization: American Academy of Sleep Medicine
  title: "Behavioral Treatment of Bedtime Problems and Night Wakings in Infants and Young Children"
  url: https://academic.oup.com/sleep/article/29/10/1263/2709180
  source_type: systematic_review
  verified: true
  last_accessed: 2026-08-25
  note: >-
    Verified 2026-08-25 against the full AASM review PDF (SLEEP 2006;29(10):1263-1276;
    review of 52 treatment studies, >2,500 subjects). Supports behavioral-intervention
    efficacy for bedtime resistance and night wakings: reviews unmodified (standard)
    extinction, graduated extinction, extinction with parental presence, positive
    routines/faded bedtime, scheduled awakenings, and parent education (p.1265).
    Efficacy: "94% (49 of 52) reported ... clinically significant reductions in bedtime
    resistance and night wakings" (p.1269); "average percentage of subjects who improved
    was 82%" maintained 3-6 months (pp.1269, 1272). CAVEAT: population is ages 0-4y11m
    (mean 20 months, p.1267); the paper does NOT state a "5-6 months onward" efficacy/
    appropriateness threshold - that age floor is not supported by this source and must
    be cited elsewhere. Consistency-mattering is stated as clinical rationale (p.1266),
    not as a measured outcome moderator (p.1272 notes no systematic reports on parent/
    child characteristics vs outcomes).

